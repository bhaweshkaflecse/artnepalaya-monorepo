<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Nepal flag: unique double-pennant (non-rectangular) shape -->
  <!-- Blue border -->
  <polygon points="5,5 95,40 5,60 95,95 5,115" fill="#003893" stroke="none"/>
  <!-- Crimson red fill (inner shape) -->
  <polygon points="12,12 85,40 12,57 85,88 12,108" fill="#DC143C" stroke="none"/>
  <!-- Upper triangle: White crescent moon -->
  <g fill="#FFFFFF">
    <!-- Moon (crescent) in upper triangle -->
    <circle cx="42" cy="32" r="10"/>
    <circle cx="42" cy="30" r="7.5" fill="#DC143C"/>
    <!-- Moon arc tips -->
    <circle cx="34" cy="27" r="2"/>
    <circle cx="50" cy="27" r="2"/>
  </g>
  <!-- Lower triangle: White 12-pointed sun -->
  <g fill="#FFFFFF" transform="translate(42,78)">
    <circle cx="0" cy="0" r="5"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(0)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(30)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(60)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(90)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(120)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(150)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(180)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(210)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(240)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(270)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(300)"/>
    <polygon points="0,-12 2,-4 -2,-4" transform="rotate(330)"/>
  </g>
</svg>
