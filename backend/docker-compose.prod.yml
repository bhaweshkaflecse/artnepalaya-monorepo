services:
  proxy:
    image: nginx:alpine
    container_name: art_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - admin
    networks:
      - artnepalaya-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: art_backend
    env_file:
      - .env.production
    expose:
      - "8080"
    depends_on:
      mongodb:
        condition: service_started
      postgresql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - artnepalaya-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  admin:
    build:
      context: ../admin
    container_name: art_admin
    networks:
      - artnepalaya-net
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: art_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - artnepalaya-net
    restart: unless-stopped

  postgresql:
    image: postgres:16-alpine
    container_name: art_postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - artnepalaya-net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: art_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - artnepalaya-net
    restart: unless-stopped

networks:
  artnepalaya-net:
    driver: bridge

volumes:
  mongodb_data:
  postgresql_data:
  redis_data:
